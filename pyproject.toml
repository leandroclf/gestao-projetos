[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-integracoes-notion"
version = "0.1.0"
description = "Auditoria e acompanhamento gerencial da equipe de Integrações."
requires-python = ">=3.11"

[project.scripts]
hive-notion = "notion_management.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

